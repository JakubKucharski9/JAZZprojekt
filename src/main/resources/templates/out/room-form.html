<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Form</title>
</head>
<body>

<h2>Room Form</h2>

<form action="/rooms" method="post" th:object="${room}">
    <label for="number">Number:</label>
    <input type="text" id="number" name="number" th:field="*{number}" required>

    <label for="capacity">Capacity:</label>
    <input type="number" id="capacity" name="capacity" th:field="*{capacity}" required>

    <label for="price">Price:</label>
    <input type="number" step="0.01" id="price" name="price" th:field="*{price}" required>

    <button type="submit">Save</button>
</form>

</body>
</html>
